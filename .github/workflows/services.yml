# LxTerm's systemctl (lxios/LxTerm/systemctl.sh): services of real packages on AlmaLinux,
# in the core's interpreter on an arm64 Linux runner (tests/linux/run_services.sh).
name: Services

on:
  push:
    branches: [main]
    paths: ["lxios/LxTerm/systemctl.sh", "tests/linux/run_services.sh", ".github/workflows/services.yml"]
  workflow_dispatch:

jobs:
  almalinux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang bc > /dev/null
      - name: Build lxrun
        run: make build/lxrun
      - name: AlmaLinux arm64 rootfs (official image, digests checked)
        run: sh tests/linux/fetch-image.sh "$RUNNER_TEMP/root" 10 almalinux
      - name: Services
        run: sh tests/linux/run_services.sh "$RUNNER_TEMP/root" almalinux
