name: App Store screenshots

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'One device only (iphone, ipad); empty for all'
        default: ''

jobs:
  roots:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: rootfs-debian.tar.gz
          key: rootfs-${{ hashFiles('scripts/make-roots.sh', 'tests/linux/fetch-debian.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang bc > /dev/null && sh scripts/make-roots.sh
      - uses: actions/upload-artifact@v4
        with: { name: rootfs, path: rootfs-debian.tar.gz, retention-days: 3 }

  shots:
    needs: roots
    runs-on: xcode-27
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: iphone, device: 'iPhone 17 Pro' }
          - { id: ipad, device: 'iPad Pro 13-inch (M5)' }
    name: ${{ matrix.id }}
    steps:
      - if: inputs.only == '' || inputs.only == matrix.id
        uses: actions/checkout@v4
      - if: inputs.only == '' || inputs.only == matrix.id
        uses: actions/download-artifact@v4
        with: { name: rootfs }
      - if: inputs.only == '' || inputs.only == matrix.id
        name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p licenses && cp LICENSE NOTICE.md licenses/
          brew install xcodegen && xcodegen generate
          xcodebuild build -project LxTerm.xcodeproj -scheme LxTerm -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | head -n 60 || true; tail -n 40 build.log; exit 1; }
      - if: inputs.only == '' || inputs.only == matrix.id
        name: Take the screenshots
        run: bash scripts/sim-shots.sh "${{ matrix.device }}" "shots/${{ matrix.id }}"
      - if: always() && (inputs.only == '' || inputs.only == matrix.id)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.id }}
          path: shots/
