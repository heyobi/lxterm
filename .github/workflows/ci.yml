# Builds the app for the simulator with Xcode 27 and runs it there: screenshots of the
# first launch (Debian unpacking, the shell). The Linux userland itself is tested in the
# core's repository (heyobi/apk-on-iphone, branch linux-userland).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }
      - run: sh scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with: { name: web, path: "lxios/web/lxweb.*", retention-days: 7 }

  roots:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: rootfs-debian.tar.gz
          key: rootfs-${{ hashFiles('scripts/make-roots.sh', 'tests/linux/fetch-debian.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang bc > /dev/null && sh scripts/make-roots.sh
      - uses: actions/upload-artifact@v4
        with: { name: rootfs, path: rootfs-debian.tar.gz, retention-days: 3 }

  simulator:
    needs: [roots, web]
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rootfs }
      - uses: actions/download-artifact@v4
        with: { name: web, path: lxios/web }
      - name: Build for the simulator
        run: |
          set -o pipefail
          mkdir -p licenses && cp LICENSE NOTICE.md licenses/
          brew install xcodegen && xcodegen generate
          xcodebuild build -project LxTerm.xcodeproj -scheme LxTerm -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | head -n 60 || true; tail -n 40 build.log; exit 1; }
      - name: Run and take screenshots
        run: |
          set -eu
          UDID=$(bash scripts/sim-device.sh "iPhone 17 Pro")
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b > /dev/null
          APP=$(find build/dd -name LxTerm.app -path '*iphonesimulator*' | head -n 1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          xcrun simctl launch "$UDID" com.heyobi.lxterm -demo -trace; sleep 3
          xcrun simctl io "$UDID" screenshot shots/1-unpacking.png
          sleep 45
          xcrun simctl io "$UDID" screenshot shots/2-shell.png
          C=$(xcrun simctl get_app_container "$UDID" com.heyobi.lxterm data)
          cp "$C"/Documents/lxterm.trace* shots/ 2>/dev/null || true
          ls -la shots
          echo "== accelerated engine"
          xcrun simctl terminate "$UDID" com.heyobi.lxterm || true
          xcrun simctl launch "$UDID" com.heyobi.lxterm -accel; sleep 170
          xcrun simctl io "$UDID" screenshot shots/3-accel.png
          cat "$C/Documents/accel.log" | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g' | tail -n 60 || true
          echo "== shared folder"; ls -la "$C/Documents/Files" || true
          cat shots/lxterm.trace* | grep -E "stopped|not impl|exec|\[unix\]|\[tty\]|\[proc\]|ended|= -(22|38|95|9|14|13|1)$" | grep -v "^\[sched" | head -n 120 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: simulator, path: shots }
