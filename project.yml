# XcodeGen spec. CI runs `xcodegen generate` to create LxTerm.xcodeproj (not checked in).
name: LxTerm
options:
  bundleIdPrefix: com.heyobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.18.0          # (1.20+ adds a build plugin that breaks CI builds)
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    GCC_C_LANGUAGE_STANDARD: gnu11
targets:
  LxTerm:
    type: application
    platform: iOS
    sources:
      - path: lxios/LxTerm
      - path: core
        includes: ["*.c", "*.h"]
        excludes: ["oracle.c"]
      - path: rootfs-debian.tar.gz
        buildPhase: resources
        optional: true
      - path: licenses
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SwiftTerm
      - sdk: libz.tbd
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heyobi.lxterm
        PRODUCT_NAME: LxTerm
        DEVELOPMENT_TEAM: U99V9TSK2X
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: lxios/LxTerm/LxTerm-Bridging-Header.h
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GCC_OPTIMIZATION_LEVEL: "2"
        OTHER_CFLAGS: ["-Wno-unused-parameter", "-Wno-shorten-64-to-32", "-Wno-comma"]
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(LX_PROFILE)    # the CI's App Store profile (testflight.yml)
    info:
      path: lxios/LxTerm/Info.plist
      properties:
        CFBundleDisplayName: LxTerm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchColor
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  LxTerm:
    build:
      targets:
        LxTerm: all
    archive:
      config: Release
